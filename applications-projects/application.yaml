apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: guestbook-ui
  namespace: argocd
spec: 
  project: default
  source:
    repoURL: https://github.com/coco2908/argocd-example-apps.git
    path: guestbook
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-app
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
