apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: guestbook-ui-sub-dir
  namespace: argocd
spec: 
  destination:
    namespace: guestbook-ui-sub-dir
    server: "https://kubernetes.default.svc"
  project: default
  source: 
    path: guestbook-with-sub-directories
    repoURL: "https://github.com/coco2908/argocd-example-apps.git"
    targetRevision: HEAD
    directory:
      recurse: true
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true

    
